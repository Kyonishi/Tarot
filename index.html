<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="星夜塔罗：用单牌或三牌牌阵，进行一次安静的自我探索。"><meta name="theme-color" content="#080b19"><title>星夜塔罗</title>

</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">THE ARCANA OF NIGHT</div><div class="brand">星夜塔罗</div><div class="sub">在星辰与内心之间，寻找一个新的角度</div></div><button class="history" id="history">抽牌记录 <span id="count">0</span></button></header>
<section class="intro"><h1>让问题在牌面上显形</h1><p>先在心中默念一个问题，再选择你的牌阵。</p><div class="choices"><button class="choice active" data-spread="1">单牌 · 今日指引</button><button class="choice" data-spread="3">三牌 · 过去 / 现在 / 未来</button></div></section><section class="table" id="table"></section><div class="draw"><button id="draw">开始抽牌</button><div class="hint">牌面仅供自我探索与反思</div></div><section class="reading" id="reading"></section><div class="footer">星夜塔罗 · 你的选择，仍然属于你自己</div></main>
<script>
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
const deck=[["愚者","新的旅程与开放的心","0","✦"],["魔术师","主动创造，把意念化为行动","I","☿"],["女祭司","倾听直觉，答案藏在沉默里","II","☾"],["皇后","滋养、丰盛与创造力","III","♀"],["皇帝","结构、边界与坚定的意志","IV","♜"],["恋人","选择、连接与价值的一致","VI","♡"],["战车","集中方向，带着决心前进","VII","⚔"],["隐者","退一步，在内在的灯火中寻找答案","IX","☼"],["命运之轮","循环转动，变化正在发生","X","◎"],["力量","温柔而坚定地驯服内在的野性","VIII","∞"],["死神","旧阶段结束，转化由此开始","XIII","☠"],["星星","希望、疗愈与遥远的愿景","XVII","☆"],["月亮","迷雾、梦境与尚未说出的恐惧","XVIII","☽"],["太阳","清晰、活力与真诚的喜悦","XIX","☀"],["世界","完成、整合与抵达新的圆环","XXI","◉"]];
deck.push(["教皇","传统、信念与传承中的智慧","V","☥"],["正义","看清事实，让行动与结果相称","XI","⚖"],["吊人","暂停、换一个角度，等待新的理解","XII","⊥"],["节制","调和不同力量，找到适合的节奏","XIV","⚗"],["恶魔","看见束缚，重新取回选择权","XV","♄"],["高塔","旧结构崩塌，为真实让路","XVI","ϟ"],["审判","回应内在召唤，做出清醒的决定","XX","◌"]);
const minorSuits=[
  ["权杖","火焰、行动与创造力","♣"],
  ["圣杯","情感、关系与直觉","♡"],
  ["宝剑","思想、判断与冲突","⚔"],
  ["星币","现实、资源与长期建设","◇"]
];
const minorRanks=[["王牌","新的能量正在点燃"],["二","在两种可能之间取得平衡"],["三","成果开始向外扩展"],["四","暂时停留，稳住已经拥有的东西"],["五","摩擦带来重新选择的机会"],["六","分享、移动与阶段性的顺利"],["七","坚持立场，守护自己的方向"],["八","重复练习，专注于手上的事"],["九","接近完成，保持最后的警觉"],["十","一个周期达到高峰，也带来负担"],["侍者","好奇、学习与新消息"],["骑士","带着速度和信念向前行动"],["王后","成熟地承接并运用这份能量"],["国王","掌握全局，以经验做出决定"]];
minorSuits.forEach(s=>minorRanks.forEach(r=>deck.push([r[0]+s[0],r[1]+"。这是"+s[0]+"领域中的课题。",r[0],s[2]])));
const majorImageNames={"愚者":"ar00","魔术师":"ar01","女祭司":"ar02","皇后":"ar03","皇帝":"ar04","教皇":"ar05","恋人":"ar06","战车":"ar07","力量":"ar08","隐者":"ar09","命运之轮":"ar10","正义":"ar11","吊人":"ar12","死神":"ar13","节制":"ar14","恶魔":"ar15","高塔":"ar16","星星":"ar17","月亮":"ar18","太阳":"ar19","审判":"ar20","世界":"ar21"};
const suitImageCodes={"权杖":"wa","圣杯":"cu","宝剑":"sw","星币":"pe"};
deck.forEach(d=>{let code=majorImageNames[d[0]];if(!code){let suit=Object.keys(suitImageCodes).find(x=>d[0].endsWith(x));let rank=d[0].slice(0,-suit.length);let ranks={"王牌":"01","二":"02","三":"03","四":"04","五":"05","六":"06","七":"07","八":"08","九":"09","十":"10","侍者":"11","骑士":"12","王后":"13","国王":"14"};code=suit?suitImageCodes[suit]+ranks[rank]:""}d[5]=code?"cards/"+code+".jpg":""});
let spread=1,selected=[],flipped=[],deckMode="full";const table=document.querySelector("#table"),reading=document.querySelector("#reading");document.head.insertAdjacentHTML("beforeend",'<style>@media(max-width:560px){.choices{flex-wrap:wrap}.choice{flex:1 1 100%;max-width:360px}.table{gap:14px}.history-box{padding:18px}.reading{padding:18px}}</style>');document.querySelector(".intro p").insertAdjacentHTML("afterend",'<input id="question" class="question" maxlength="80" placeholder="写下你此刻想探索的问题（可选）"><select id="deck-mode" class="deck-mode"><option value="full">完整牌组 · 78 张</option><option value="major">大阿卡那 · 22 张</option></select>');document.querySelector("#deck-mode").onchange=e=>deckMode=e.target.value;
function render(){table.innerHTML="";const labels=spread===1?["今日指引"]:["过去","现在","未来"];for(let i=0;i<spread;i++){let slot=document.createElement("div");slot.className="card-slot"+(i>0?" locked":"");slot.innerHTML='<div class="slot-label">'+labels[i]+'</div>';let c=document.createElement("div");c.className="card back";c.setAttribute("role","button");c.setAttribute("tabindex",i===0?"0":"-1");c.setAttribute("aria-label","翻开"+labels[i]+"牌");c.onclick=()=>flip(i);c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip(i)}};slot.append(c);table.append(slot)}}
function cardImage(d){return d[5]||""}function cardKeywords(d){if(d[0].endsWith("权杖"))return "行动 · 创造 · 意志";if(d[0].endsWith("圣杯"))return "情感 · 直觉 · 关系";if(d[0].endsWith("宝剑"))return "思想 · 判断 · 沟通";if(d[0].endsWith("星币"))return "现实 · 资源 · 建设";return "转变 · 觉察 · 选择"}function cardAdvice(d){return d[4]?"先观察阻力来自哪里，再决定是否继续推进。":"把这张牌代表的能量落实为一个今天可以完成的小行动。"}
function flip(i){if(!selected.length)return;let slot=table.children[i],c=slot.querySelector(".card"),d=selected[i];if(slot.classList.contains("locked")||c.classList.contains("face")||c.classList.contains("flipping"))return;c.classList.add("flipping");setTimeout(()=>{c.className="card face"+(d[4]?" reversed":"");let image=cardImage(d);c.innerHTML=(image?'<img src="'+escapeHTML(image)+'" alt="'+escapeHTML(d[0])+'" loading="lazy">':'<div class="sigil">'+escapeHTML(d[3])+'</div>')+'<b>'+escapeHTML(d[0])+'</b><small>'+(d[4]?"逆位":"正位")+"</small>";if(table.children[i+1]){table.children[i+1].classList.remove("locked");table.children[i+1].querySelector(".card").setAttribute("tabindex","0");document.querySelector(".hint").textContent="请翻开下一张牌"}flipped[i]=true;if(flipped.filter(Boolean).length===spread){document.querySelector(".hint").textContent="牌阵已完成 · 可以重新抽牌";let q=document.querySelector("#question").value.trim();reading.innerHTML="<h2>牌面讯息</h2>"+(q?'<p class="question-display">占问：'+escapeHTML(q)+'</p>':"")+selected.map((d,i)=>'<p><span class="position">'+(spread===1?"今日指引":["过去","现在","未来"][i])+" · "+escapeHTML(d[0])+" · "+(d[4]?"逆位":"正位")+"</span><br><strong>关键词：</strong>"+escapeHTML(cardKeywords(d))+"<br>"+escapeHTML(d[1])+"<br><strong>行动提示：</strong>"+escapeHTML(cardAdvice(d))+"</p>").join("");reading.classList.add("show");saveReading()}},720)}
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{document.querySelectorAll(".choice").forEach(x=>x.classList.remove("active"));b.classList.add("active");spread=+b.dataset.spread;selected=[];flipped=[];reading.classList.remove("show");render()});
function getHistory(){try{const value=JSON.parse(localStorage.getItem("nightTarotHistory")||"[]");return Array.isArray(value)?value.filter(x=>x&&Array.isArray(x.cards)):[]}catch{return[]}}
function saveReading(){let history=getHistory(),question=escapeHTML(document.querySelector("#question").value.trim());history.unshift({time:new Date().toLocaleString(),question,spread,cards:selected.map(d=>({name:d[0],reversed:!!d[4]}))});history=history.slice(0,20);localStorage.setItem("nightTarotHistory",JSON.stringify(history));document.querySelector("#count").textContent=history.length}
function showHistory(){let history=getHistory(),panel=document.createElement("div");panel.className="history-panel";panel.innerHTML='<div class="history-box"><button class="history-close">关闭</button><h2>星夜记录</h2>'+(history.length?history.map((x,i)=>'<div class="history-item"><button data-remove="'+i+'">删除</button><small>'+x.time+'</small>'+(x.question?'<div>占问：'+x.question+'</div>':"")+"<div>牌面："+x.cards.map(c=>c.name+(c.reversed?"（逆位）":"")).join("、")+'</div></div>').join(""):'<p>还没有抽牌记录。</p>')+(history.length?'<div class="history-actions"><button id="clear-history">清空全部记录</button></div>':"")+"</div>";document.body.append(panel);panel.querySelector(".history-close").onclick=()=>panel.remove();panel.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{let h=getHistory();h.splice(+b.dataset.remove,1);localStorage.setItem("nightTarotHistory",JSON.stringify(h));panel.remove();document.querySelector("#history").click()});let clear=panel.querySelector("#clear-history");if(clear)clear.onclick=()=>{localStorage.removeItem("nightTarotHistory");document.querySelector("#count").textContent="0";panel.remove()}}
function sparkle(x,y){for(let i=0;i<7;i++){let s=document.createElement("span");s.className="star-spark";s.textContent=Math.random()>.35?"✦":"✧";s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--dx",(Math.random()*110-55)+"px");s.style.setProperty("--dy",(Math.random()*-90-15)+"px");document.body.append(s);setTimeout(()=>s.remove(),800)}}document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelector(".history-panel")?.remove()});new MutationObserver(()=>{let actions=document.querySelector(".history-actions");if(actions&&!actions.querySelector("#export-history")){let b=document.createElement("button");b.id="export-history";b.textContent="导出记录";actions.prepend(b);b.onclick=()=>{let blob=new Blob([JSON.stringify(getHistory(),null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="starry-tarot-history.json";a.click();URL.revokeObjectURL(url)}}}).observe(document.body,{childList:true,subtree:true});
document.addEventListener("pointerdown",e=>{if(e.target.closest(".card,.draw button,.choice"))sparkle(e.clientX,e.clientY)});document.querySelector("#draw").onclick=()=>{let button=document.querySelector("#draw");button.disabled=true;button.textContent="星尘洗牌中…";selected=[];flipped=[];reading.classList.remove("show");render();document.querySelectorAll(".card").forEach(c=>c.classList.add("shuffling"));setTimeout(()=>{let pool=(deckMode==="major"?deck.slice(0,22):deck).slice();selected=Array.from({length:spread},()=>{let d=pool.splice(Math.floor(Math.random()*pool.length),1)[0].slice();d[4]=Math.random()<.28;return d});button.disabled=false;button.textContent="开始抽牌";document.querySelector(".hint").textContent="请翻开第一张牌";render()},850)};document.querySelector("#history").onclick=showHistory;document.querySelector("#count").textContent=getHistory().length;render();
 document.head.insertAdjacentHTML("beforeend",'<style>.card{transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease}.card.back:hover{transform:translateY(-6px) rotateZ(-1deg);box-shadow:0 18px 42px #000b,0 0 24px #8d72d855}.card.flipping{animation:cardFlip .7s cubic-bezier(.2,.8,.25,1) both;pointer-events:none}.card.shuffling{animation:shuffleCard .42s ease-in-out infinite alternate}.card-slot:nth-child(2) .shuffling{animation-delay:.08s}.card-slot:nth-child(3) .shuffling{animation-delay:.16s}@keyframes cardFlip{0%{transform:perspective(700px) rotateY(0) scale(1)}45%{transform:perspective(700px) rotateY(90deg) scale(1.08)}100%{transform:perspective(700px) rotateY(180deg) scale(1)}}@keyframes shuffleCard{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}.face.revealed{animation:revealGlow 1.2s ease-out}@keyframes revealGlow{0%{box-shadow:0 0 0 #d9b86a00}35%{box-shadow:0 0 35px #d9b86aaa,0 0 70px #8d72d855}100%{box-shadow:0 14px 35px #0008}}</style>');document.addEventListener("animationstart",e=>{if(e.animationName==="cardFlip")e.target.classList.add("revealed")});
document.querySelector("#deck-mode").style.cssText="display:block;margin:12px auto 0;padding:9px 15px;border:1px solid #d9b86a66;border-radius:20px;background:#17152d;color:#d9b86a;font:inherit;text-align:center;outline:none";document.head.insertAdjacentHTML("beforeend",'<style>@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}</style>');
document.head.insertAdjacentHTML("beforeend",'<style>.card{flex:0 0 148px;max-width:148px;max-height:228px}.face{position:relative;overflow:hidden}.face img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);max-width:calc(100% - 24px);max-height:calc(100% - 24px);object-fit:cover;border-radius:5px}.back{background-image:radial-gradient(circle at center,#8d72d855 0,transparent 34%),linear-gradient(145deg,#272052,#0f1229);background-size:auto;background-position:center}.back:before{background:transparent}.back:after{content:"";position:absolute;inset:12px;border:1px solid #d9b86a66;border-radius:5px;box-shadow:inset 0 0 20px #8d72d833}@media(max-width:560px){.card{flex-basis:112px;max-width:112px;max-height:174px}}</style>');document.addEventListener("error",e=>{if(e.target.tagName==="IMG"){e.target.style.display="none"}},true);
document.addEventListener("animationstart",e=>{if(e.animationName==="cardFlip"){let r=e.target.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2)}});
document.head.insertAdjacentHTML("beforeend",'<style>.star-spark{z-index:999!important;display:block!important;color:#ffe99a!important;font-size:20px!important;opacity:1!important}.face.revealed{animation:revealGlow 1.2s ease-out}@keyframes revealGlow{0%{box-shadow:0 0 0 #d9b86a00}35%{box-shadow:0 0 35px #d9b86aaa,0 0 70px #8d72d855}100%{box-shadow:0 14px 35px #0008}}</style>');
document.head.insertAdjacentHTML("beforeend",'<style>.face img{inset:10px 10px auto;height:calc(100% - 62px);object-fit:cover}.face b,.face small{position:relative;z-index:2;background:#17152ddd;padding:1px 5px;border-radius:4px}.face b{margin-top:auto}.face small{margin-bottom:2px}</style>');
 function cardAdvice(d){const a={"愚者":"尝试一件新事，不必先规划全部路线。","魔术师":"调用手边的一项资源，立刻推进计划。","女祭司":"留出安静时间，先记录直觉再决定。","皇后":"照顾身体或环境，让想法得到滋养。","皇帝":"设定清晰边界，安排可执行的时间表。","教皇":"向可靠的传统、老师或流程借一份参考。","恋人":"明确真正重视的标准，再做选择。","战车":"选定方向，今天只完成最关键的一步。","力量":"用耐心和稳定回应压力，不靠强硬取胜。","隐者":"暂时远离噪音，独自整理思路。","命运之轮":"留意正在出现的转机，准备好调整计划。","正义":"核对事实与责任，让决定经得起回看。","吊人":"暂缓熟悉的做法，换一个角度观察问题。","死神":"结束一项已经完成使命的安排，为新阶段腾出空间。","节制":"把两件重要的事调成可持续的节奏。","恶魔":"写下一个正在牵制你的习惯，并主动设一道边界。","高塔":"先保护关键部分，再诚实面对必须重建的地方。","星星":"写下愿望，并完成最小的第一步。","月亮":"先核实信息，暂缓基于猜测的行动。","太阳":"把成果分享给可信的人，接受反馈。","审判":"回应一个反复出现的召唤，做出清醒决定。","世界":"收尾一件拖延的事，并记录收获。","权杖":"把热情变成一个具体行动，今天先迈出第一步。","圣杯":"主动表达一次真实感受，给关系留出回应空间。","宝剑":"把问题拆成事实、判断和下一步，先处理最清楚的一项。","星币":"完成一件现实事务，建立可见的进度。"};let key=Object.keys(a).find(x=>d[0]===x||d[0].endsWith(x));let t=a[key]||"把注意力放回眼前最具体的一步。";return d[4]?"先放慢脚步，确认阻力后再推进："+t:t}
document.head.insertAdjacentHTML("beforeend",'<style>.question{display:block;width:min(100%,520px);margin:18px auto 0;padding:10px 14px;border:1px solid #d9b86a66;border-radius:8px;background:#10142a;color:#f6f0df;font:inherit}.question::placeholder{color:#aaa7c2}.card-slot{display:flex;flex-direction:column;align-items:center;gap:8px}.slot-label{color:var(--muted);font-size:13px}.card-slot.locked{opacity:.55}.history-panel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#080b19cc}.history-box{width:min(100%,680px);max-height:80vh;overflow:auto;background:#14172d;border:1px solid #d9b86a66;border-radius:12px;padding:24px}.history-item{padding:12px 0;border-top:1px solid #ffffff18}.history-item button{float:right}.star-spark{position:fixed;pointer-events:none;animation:spark .8s ease-out both}.reversed img{transform:none!important}@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}</style>');
