<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="星夜塔罗：用单牌或三牌牌阵，进行一次安静的自我探索。"><meta name="theme-color" content="#080b19"><title>星夜塔罗</title>
<style>.reading.show{animation:readingIn .7s ease both}@keyframes readingIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}</style><style>
:root{--bg:#080b19;--panel:#14172d;--gold:#d9b86a;--muted:#aaa7c2;--violet:#8d72d8}
*{box-sizing:border-box}body{margin:0;color:#f6f0df;background:radial-gradient(circle at 50% -10%,#342552,#11152b 45%,var(--bg));font:16px/1.6 Georgia,"Noto Serif SC",serif;min-height:100vh}.wrap{max-width:960px;margin:auto;padding:55px 22px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #d9b86a55;padding-bottom:20px}.eyebrow{color:var(--gold);letter-spacing:4px;font-size:12px}.brand{font-size:42px;letter-spacing:8px}.sub,p{color:var(--muted)}button{font:inherit;cursor:pointer}.history,.choice{border:1px solid #d9b86a66;background:#ffffff08;color:var(--gold);border-radius:20px;padding:8px 15px}.intro{text-align:center;padding:40px 0 25px}.intro h1{font-weight:normal;font-size:32px;margin:0 0 8px}.choices{display:flex;justify-content:center;gap:10px;margin-top:22px}.choice{border-radius:7px;color:#eee4ce}.choice.active,.choice:hover{background:#d9b86a22}.table{min-height:290px;display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap}.card{width:148px;height:228px;border-radius:9px;border:1px solid var(--gold);background:linear-gradient(135deg,#292452,#10142c);box-shadow:0 14px 35px #0008;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}.back:before{content:"✦";font-size:55px;color:var(--gold);text-shadow:0 0 22px var(--violet);border:1px solid #d9b86a66;width:105px;height:177px;display:grid;place-items:center}.face{background:linear-gradient(160deg,#38295d,#17192f);flex-direction:column;gap:7px;padding:15px;text-align:center}.sigil{font-size:52px;color:var(--gold)}.face small{color:var(--muted)}.reversed{transform:rotate(180deg)}.reversed>*{transform:rotate(180deg)}.draw{text-align:center;margin:18px}.draw button{background:linear-gradient(135deg,#c99549,#e6c477);border:0;border-radius:24px;padding:12px 32px;color:#21162a}.hint{font-size:13px;color:var(--muted);margin-top:10px}.reading{display:none;background:#10142aee;border:1px solid #d9b86a55;border-radius:12px;padding:23px;max-width:720px;margin:28px auto}.reading.show{display:block}.reading h2{color:var(--gold);font-weight:normal}.reading p{margin:12px 0}.position{color:#d98b9e;font-size:13px}.footer{text-align:center;color:#77758e;font-size:12px;margin-top:45px}@media(max-width:560px){.brand{font-size:30px}.card{width:112px;height:174px}.back:before{width:78px;height:130px;font-size:40px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">THE ARCANA OF NIGHT</div><div class="brand">星夜塔罗</div><div class="sub">在星辰与内心之间，寻找一个新的角度</div></div><button class="history" id="history">抽牌记录 <span id="count">0</span></button></header>
<section class="intro"><h1>让问题在牌面上显形</h1><p>先在心中默念一个问题，再选择你的牌阵。</p><div class="choices"><button class="choice active" data-spread="1">单牌 · 今日指引</button><button class="choice" data-spread="3">三牌 · 过去 / 现在 / 未来</button></div></section><section class="table" id="table"></section><div class="draw"><button id="draw">开始抽牌</button><div class="hint">牌面仅供自我探索与反思</div></div><section class="reading" id="reading"></section><div class="footer">星夜塔罗 · 你的选择，仍然属于你自己</div></main>
<script src="tarot-data.js"></script><script src="app.js"></script></body></html>
